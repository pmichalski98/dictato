[package]
name = "Dictato"
version = "0.1.0"
description = "Dictato - Voice transcription app"
authors = ["you"]
edition = "2021"

[lib]
name = "dictato_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
enigo = "0.6.1"
reqwest = { version = "0.11", features = ["multipart", "json"] }
cpal = "0.15"
rubato = "0.15"
tempfile = "3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
regex = "1"
once_cell = "1"
whisper-rs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
# CoreML runs the encoder on the Neural Engine; whisper.cpp falls back to Metal if the mlmodelc is missing
whisper-rs = { version = "0.16", features = ["metal", "coreml"] }
# Local LLM inference (GGUF), macOS only. whisper-rs and llama-cpp-2 both
# bundle ggml; ld64 resolves the shared `-lggml` to one archive (llama.cpp's,
# the newer) and both engines run fine on it. rust-lld and MSVC link both
# copies from the rlibs and fail with duplicate symbols, so Windows/Linux
# would need the LLM in a sidecar process. See local_llm.rs.
llama-cpp-2 = { version = "0.1.156", default-features = false, features = ["metal"] }
encoding_rs = "0.8"
